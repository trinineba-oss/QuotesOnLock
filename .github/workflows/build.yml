name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quotes-on-lock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk quotes-on-lock.apk
          # version.json is what the in-app updater reads (build number, change summary, APK size).
          python3 -c 'import json,os,subprocess; print(json.dumps({"build": int(os.environ["GITHUB_RUN_NUMBER"]), "notes": subprocess.check_output(["git","log","-1","--format=%s"], text=True).strip(), "size": os.path.getsize("quotes-on-lock.apk")}))' > version.json
          cat version.json
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest quotes-on-lock.apk version.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build" \
            --notes "Build ${GITHUB_RUN_NUMBER} ($(git log -1 --format=%h))
          $(git log -1 --format=%s)"
